[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ebrain"
version = "0.1.0"
description = "Developmental AI with Dynamic Growth"
authors = [{ name = "Loganathan Sekaran" }]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Core runtime. Horizon-specific stacks are optional extras (see docs/PLAN.md).
# Horizon 1 deliberately uses a plain PyTorch training loop, without Lightning
# (docs/14-horizon-1-spec.md §5).
dependencies = [
    "torch>=2.4",
    "numpy>=1.26",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
]

[project.optional-dependencies]
# Horizon 1: continual-learning benchmarks + frozen-CLIP track B
h1 = [
    "torchvision>=0.19",
    "transformers>=4.44",
]
# Horizon 2: grounded environments
h2 = [
    "gymnasium>=1.0",
    "minigrid>=2.4",
]
tracking = [
    "wandb>=0.17",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["docs", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["ebrain"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
